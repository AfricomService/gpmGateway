<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-note-frais-heading"
        data-cy="NoteFraisCreateUpdateHeading"
        jhiTranslate="gpmGatewayApp.operationsServiceNoteFrais.home.createOrEditLabel"
      >
        Créer ou éditer un Note Frais
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="gpmGatewayApp.operationsServiceNoteFrais.dateDebut" for="field_dateDebut"
            >Date Debut</label
          >
          <div class="d-flex">
            <input
              id="field_dateDebut"
              data-cy="dateDebut"
              type="datetime-local"
              class="form-control"
              name="dateDebut"
              formControlName="dateDebut"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="gpmGatewayApp.operationsServiceNoteFrais.dateFin" for="field_dateFin">Date Fin</label>
          <div class="d-flex">
            <input
              id="field_dateFin"
              data-cy="dateFin"
              type="datetime-local"
              class="form-control"
              name="dateFin"
              formControlName="dateFin"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="gpmGatewayApp.operationsServiceNoteFrais.contactSocieteId" for="field_contactSocieteId"
            >Contact Societe Id</label
          >
          <input
            type="number"
            class="form-control"
            name="contactSocieteId"
            id="field_contactSocieteId"
            data-cy="contactSocieteId"
            formControlName="contactSocieteId"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="gpmGatewayApp.operationsServiceNoteFrais.montantTotale" for="field_montantTotale"
            >Montant Totale</label
          >
          <input
            type="number"
            class="form-control"
            name="montantTotale"
            id="field_montantTotale"
            data-cy="montantTotale"
            formControlName="montantTotale"
          />
        </div>

        <div class="row mb-3">
          <label
            class="form-label"
            jhiTranslate="gpmGatewayApp.operationsServiceNoteFrais.montantTotaleEnLettre"
            for="field_montantTotaleEnLettre"
            >Montant Totale En Lettre</label
          >
          <input
            type="text"
            class="form-control"
            name="montantTotaleEnLettre"
            id="field_montantTotaleEnLettre"
            data-cy="montantTotaleEnLettre"
            formControlName="montantTotaleEnLettre"
          />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
