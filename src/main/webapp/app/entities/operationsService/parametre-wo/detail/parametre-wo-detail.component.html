<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="parametreWO">
      <h2 data-cy="parametreWODetailsHeading">
        <span jhiTranslate="gpmGatewayApp.operationsServiceParametreWo.detail.title">Parametre WO</span>
      </h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ parametreWO.id }}</span>
        </dd>
        <dt><span jhiTranslate="gpmGatewayApp.operationsServiceParametreWo.nom">Nom</span></dt>
        <dd>
          <span>{{ parametreWO.nom }}</span>
        </dd>
        <dt><span jhiTranslate="gpmGatewayApp.operationsServiceParametreWo.description">Description</span></dt>
        <dd>
          <span>{{ parametreWO.description }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/parametre-wo', parametreWO.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
  </div>
</div>
