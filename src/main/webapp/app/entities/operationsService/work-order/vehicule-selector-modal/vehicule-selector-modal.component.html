<div class="modal-header cs-modal-header">
  <h5 class="modal-title">{{ modalTitle }}</h5>
  <button type="button" class="btn-close" aria-label="Fermer" (click)="cancel()"></button>
</div>

<div class="modal-body cs-modal-body">
  <div class="cs-search-bar">
    <input
      type="text"
      class="form-control cs-search-input"
      placeholder="Rechercher une marque, un type ou un matricule..."
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchChange($event)"
      [ngModelOptions]="{ standalone: true }"
      autocomplete="off"
    />
  </div>

  <div class="cs-loading" *ngIf="loading">Chargement...</div>

  <div class="alert alert-danger py-2 px-3 mb-2" *ngIf="conflictMessage" role="alert">
    <fa-icon icon="exclamation-triangle"></fa-icon>&nbsp;{{ conflictMessage }}
  </div>

  <div class="cs-list" *ngIf="!loading">
    <button
      type="button"
      class="cs-list-item"
      [class.cs-list-item-selected]="multiple && isSelected(vehicule)"
      *ngFor="let vehicule of filteredVehicules"
      (click)="select(vehicule)"
    >
      <input
        *ngIf="multiple"
        type="checkbox"
        class="cs-list-item-checkbox"
        [checked]="isSelected(vehicule)"
        [disabled]="checkingVehiculeId === vehicule.id"
        (click)="$event.preventDefault(); $event.stopPropagation(); toggleSelection(vehicule)"
      />
      <span
        *ngIf="multiple && checkingVehiculeId === vehicule.id"
        class="spinner-border spinner-border-sm cs-list-item-spinner"
        role="status"
        aria-hidden="true"
      ></span>

      <div class="cs-list-item-main">
        <span class="cs-list-item-name">{{ vehicule.marque }} {{ vehicule.type }}</span>
        <small class="cs-list-item-email" *ngIf="vehicule.typeCarburant">
          {{ vehicule.typeCarburant }} · {{ vehicule.nbPlaces }} places
        </small>
      </div>
      <span class="cs-list-item-matricule" *ngIf="vehicule.matricule">{{ vehicule.matricule }}</span>
    </button>

    <div class="cs-empty" *ngIf="filteredVehicules.length === 0">Aucun véhicule trouvé.</div>
  </div>
</div>

<div class="modal-footer cs-modal-footer">
  <span class="cs-selection-count" *ngIf="multiple">{{ selectedVehicules.length }} sélectionné(s)</span>

  <button type="button" class="btn-cs-cancel" (click)="cancel()">
    <fa-icon icon="ban"></fa-icon>
    &nbsp;
    <span>Annuler</span>
  </button>

  <button type="button" class="btn-cs-confirm" *ngIf="multiple" (click)="confirm()">
    <fa-icon icon="check"></fa-icon>
    &nbsp;
    <span>Valider</span>
  </button>
</div>
