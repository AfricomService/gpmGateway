<div class="ressource-list-page">
  <div class="rs-container">
    <!-- Header -->
    <div class="rs-header">
      <div class="rs-header-left">
        <h2 id="page-heading" data-cy="RessourceHeading" class="rs-title">
          <span jhiTranslate="gpmGatewayApp.projectServiceRessource.home.title">Ressources</span>
        </h2>
        <span class="rs-count" *ngIf="ressources">{{ totalItems }} élément(s)</span>
      </div>

      <div class="rs-header-actions">
        <button type="button" class="btn-rs-refresh" (click)="load()" [disabled]="isLoading" title="Actualiser">
          <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        </button>

        <button id="jh-create-entity" data-cy="entityCreateButton" class="btn-rs-create create-ressource" [routerLink]="['/ressource/new']">
          <fa-icon icon="plus"></fa-icon>
          <span jhiTranslate="gpmGatewayApp.projectServiceRessource.home.createLabel"> Créer un nouveau Ressource </span>
        </button>
      </div>
    </div>

    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>

    <!-- Empty state -->
    <div class="rs-empty" id="no-result" *ngIf="ressources?.length === 0">
      <fa-icon icon="folder" class="rs-empty-icon"></fa-icon>
      <span jhiTranslate="gpmGatewayApp.projectServiceRessource.home.notFound">Aucun Ressource trouvé</span>
    </div>

    <!-- Table card -->
    <div class="rs-card" id="entities" *ngIf="ressources && ressources.length > 0">
      <div class="table-responsive">
        <table class="rs-table" aria-describedby="page-heading">
          <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="navigateToWithComponentValues()">
              <th scope="col" jhiSortBy="nom">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceRessource.nom">Nom</span>
                  <fa-icon class="rs-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" jhiSortBy="code">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceRessource.code">Code</span>
                  <fa-icon class="rs-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" jhiSortBy="categorie">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceRessource.categorie">Categorie</span>
                  <fa-icon class="rs-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" jhiSortBy="description">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceRessource.description">Description</span>
                  <fa-icon class="rs-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" jhiSortBy="typeRessourceId">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceRessource.typeRessourceId">Type ressource</span>
                  <fa-icon class="rs-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" jhiSortBy="statut">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceRessource.statut">Statut</span>
                  <fa-icon class="rs-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" class="rs-th-actions"></th>
            </tr>
          </thead>
          <tbody>
            <tr
              *ngFor="let ressource of ressources; trackBy: trackId"
              data-cy="entityTable"
              class="rs-row-clickable"
              (dblclick)="onRowDoubleClick(ressource)"
            >
              <td class="rs-cell-strong" data-label="Nom">{{ ressource.nom }}</td>
              <td data-label="Code">{{ ressource.code }}</td>
              <td data-label="Categorie">
                <span class="rs-badge-categorie" *ngIf="ressource.categorie">{{ ressource.categorie }}</span>
                <span class="rs-empty-value" *ngIf="!ressource.categorie">—</span>
              </td>
              <td class="rs-cell-truncate" data-label="Description">{{ ressource.description || '—' }}</td>
              <td data-label="Type ressource">
                <span class="rs-badge-type" *ngIf="getTypeRessourceLabel(ressource.typeRessourceId) as typeLabel">{{ typeLabel }}</span>
                <span class="rs-empty-value" *ngIf="!getTypeRessourceLabel(ressource.typeRessourceId)">—</span>
              </td>
              <td data-label="Statut">
                <span class="rs-badge-statut" *ngIf="ressource.statut" [ngClass]="'rs-badge-statut-' + ressource.statut.toLowerCase()">
                  {{ ressource.statut }}
                </span>
                <span class="rs-empty-value" *ngIf="!ressource.statut">—</span>
              </td>
              <td class="text-end" data-label="Actions">
                <div class="rs-actions">
                  <button
                    type="button"
                    (click)="delete(ressource); $event.stopPropagation()"
                    class="btn-rs-icon btn-rs-delete"
                    data-cy="entityDeleteButton"
                    title="Supprimer"
                  >
                    <fa-icon icon="trash-alt"></fa-icon>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer : count + pagination centrés -->
    <div class="rs-footer" *ngIf="ressources && ressources.length > 0">
      <div class="rs-footer-count">
        <jhi-item-count [params]="{ page: page, totalItems: totalItems, itemsPerPage: itemsPerPage }"></jhi-item-count>
      </div>

      <div class="rs-footer-pagination">
        <ngb-pagination
          [collectionSize]="totalItems"
          [page]="page"
          [pageSize]="itemsPerPage"
          [maxSize]="5"
          [rotate]="true"
          [boundaryLinks]="true"
          (pageChange)="navigateToPage($event)"
        ></ngb-pagination>
      </div>
    </div>
  </div>
</div>
