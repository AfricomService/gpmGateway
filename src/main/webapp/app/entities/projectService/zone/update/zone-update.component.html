<div class="cu-zone-update">
  <div class="cu-container">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <jhi-alert-error></jhi-alert-error>

      <!-- ====================================================== -->
      <!-- TOOLBAR -->
      <!-- ====================================================== -->
      <div class="cu-toolbar cu-toolbar-end">
        <span class="cu-badge-id" *ngIf="zone?.id"> Zone #{{ zone?.id }} </span>

        <!-- ID conservé dans le formulaire (non modifiable) -->
        <input type="hidden" formControlName="id" data-cy="id" />

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          title="Sauvegarder"
          [disabled]="editForm.invalid || isSaving"
          class="btn-cu-save"
        >
          <fa-icon icon="save"></fa-icon>
        </button>
      </div>

      <!-- ====================================================== -->
      <!-- ACCORDEON -->
      <!-- ====================================================== -->
      <div class="cu-accordion">
        <!-- SECTION 1 : INFORMATIONS GENERALES -->
        <div class="cu-accordion-item" [class.open]="isPanelOpen('global')">
          <button type="button" class="cu-accordion-header" (click)="togglePanel('global')">
            <span class="cu-accordion-header-left">
              <fa-icon icon="building" class="cu-accordion-icon"></fa-icon>
              <span
                id="jhi-zone-heading"
                data-cy="ZoneCreateUpdateHeading"
                jhiTranslate="gpmGatewayApp.projectServiceZone.home.createOrEditLabel"
                >Créer ou éditer un Zone</span
              >
            </span>
            <fa-icon icon="chevron-down" class="cu-accordion-chevron"></fa-icon>
          </button>

          <div class="cu-accordion-body" *ngIf="isPanelOpen('global')">
            <!-- LIGNE 1 : NOM + VILLE -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="field_nom">
                  <span jhiTranslate="gpmGatewayApp.projectServiceZone.nom">Nom</span>
                  <span class="cu-required">*</span>
                </label>
                <input type="text" class="form-control cu-input" name="nom" id="field_nom" data-cy="nom" formControlName="nom" required />
                <div *ngIf="editForm.get('nom')!.invalid && (editForm.get('nom')!.dirty || editForm.get('nom')!.touched)">
                  <small
                    class="form-text text-danger"
                    *ngIf="editForm.get('nom')?.errors?.required"
                    jhiTranslate="entity.validation.required"
                  >
                    Ce champ est obligatoire.
                  </small>
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label" for="field_ville">
                  <span jhiTranslate="gpmGatewayApp.projectServiceZone.ville">Ville</span>
                  <span class="cu-required">*</span>
                </label>
                <select
                  class="form-select cu-input"
                  id="field_ville"
                  data-cy="ville"
                  name="ville"
                  formControlName="ville"
                  [compareWith]="compareVille"
                  required
                >
                  <option [ngValue]="null" disabled>-- Sélectionner quelque chose --</option>
                  <option [ngValue]="villeOption" *ngFor="let villeOption of villesSharedCollection">{{ villeOption.nom }}</option>
                </select>
                <div *ngIf="editForm.get(['ville'])!.invalid && (editForm.get(['ville'])!.dirty || editForm.get(['ville'])!.touched)">
                  <small
                    class="form-text text-danger"
                    *ngIf="editForm.get(['ville'])?.errors?.required"
                    jhiTranslate="entity.validation.required"
                  >
                    Ce champ est obligatoire.
                  </small>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ====================================================== -->
      <!-- FOOTER -->
      <!-- ====================================================== -->
      <div class="cu-toolbar cu-toolbar-bottom cu-toolbar-end">
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn-cu-cancel" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>
          &nbsp;
          <span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>
      </div>
    </form>
  </div>
</div>
