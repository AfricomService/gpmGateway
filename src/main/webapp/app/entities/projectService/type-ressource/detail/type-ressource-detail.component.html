<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="typeRessource">
      <h2 data-cy="typeRessourceDetailsHeading">
        <span jhiTranslate="gpmGatewayApp.projectServiceTypeRessource.detail.title">Type Ressource</span>
      </h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ typeRessource.id }}</span>
        </dd>
        <dt><span jhiTranslate="gpmGatewayApp.projectServiceTypeRessource.type">Type</span></dt>
        <dd>
          <span>{{ typeRessource.type }}</span>
        </dd>
        <dt><span jhiTranslate="gpmGatewayApp.projectServiceTypeRessource.code">Code</span></dt>
        <dd>
          <span>{{ typeRessource.code }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/type-ressource', typeRessource.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
  </div>
</div>
