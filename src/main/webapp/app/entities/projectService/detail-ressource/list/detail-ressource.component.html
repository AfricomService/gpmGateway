<div class="detail-ressource-list-page">
  <div class="dr-container">
    <!-- Header -->
    <div class="dr-header">
      <div class="dr-header-left">
        <h2 id="page-heading" data-cy="DetailRessourceHeading" class="dr-title">
          <span jhiTranslate="gpmGatewayApp.projectServiceDetailRessource.home.title">DetailRessources</span>
        </h2>
        <span class="dr-count" *ngIf="detailRessources">{{ totalItems }} élément(s)</span>
      </div>

      <div class="dr-header-actions">
        <button type="button" class="btn-dr-refresh" (click)="load()" [disabled]="isLoading" title="Actualiser">
          <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        </button>

        <button
          id="jh-create-entity"
          data-cy="entityCreateButton"
          class="btn-dr-create create-detail-ressource"
          [routerLink]="['/detail-ressource/new']"
        >
          <fa-icon icon="plus"></fa-icon>
          <span jhiTranslate="gpmGatewayApp.projectServiceDetailRessource.home.createLabel"> Créer un nouveau Detail Ressource </span>
        </button>
      </div>
    </div>

    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>

    <!-- Empty state -->
    <div class="dr-empty" id="no-result" *ngIf="detailRessources?.length === 0">
      <fa-icon icon="folder" class="dr-empty-icon"></fa-icon>
      <span jhiTranslate="gpmGatewayApp.projectServiceDetailRessource.home.notFound">Aucun Detail Ressource trouvé</span>
    </div>

    <!-- Table card -->
    <div class="dr-card" id="entities" *ngIf="detailRessources && detailRessources.length > 0">
      <div class="table-responsive">
        <table class="dr-table" aria-describedby="page-heading">
          <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="navigateToWithComponentValues()">
              <th scope="col" jhiSortBy="label">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceDetailRessource.label">Label</span>
                  <fa-icon class="dr-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" jhiSortBy="code">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceDetailRessource.code">Code</span>
                  <fa-icon class="dr-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" jhiSortBy="status">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceDetailRessource.status">Status</span>
                  <fa-icon class="dr-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" jhiSortBy="required">
                <div class="d-flex align-items-center">
                  <span jhiTranslate="gpmGatewayApp.projectServiceDetailRessource.required">Required</span>
                  <fa-icon class="dr-sort-icon" icon="sort"></fa-icon>
                </div>
              </th>
              <th scope="col" class="dr-th-actions"></th>
            </tr>
          </thead>
          <tbody>
            <tr
              *ngFor="let detailRessource of detailRessources; trackBy: trackId"
              data-cy="entityTable"
              class="dr-row-clickable"
              (dblclick)="onRowDoubleClick(detailRessource)"
            >
              <td>{{ detailRessource.label }}</td>
              <td>{{ detailRessource.code }}</td>
              <td>
                <span class="dr-badge-status" [class.dr-badge-status-off]="!detailRessource.status">
                  {{ detailRessource.status ? 'Actif' : 'Inactif' }}
                </span>
              </td>
              <td>
                <fa-icon *ngIf="detailRessource.required" icon="check" class="dr-icon-yes"></fa-icon>
                <fa-icon *ngIf="!detailRessource.required" icon="times" class="dr-icon-no"></fa-icon>
              </td>
              <td class="text-end">
                <div class="dr-actions">
                  <button
                    type="button"
                    (click)="delete(detailRessource); $event.stopPropagation()"
                    class="btn-dr-icon btn-dr-delete"
                    data-cy="entityDeleteButton"
                    title="Supprimer"
                  >
                    <fa-icon icon="trash-alt"></fa-icon>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer : count + pagination centrés -->
    <div class="dr-footer" *ngIf="detailRessources && detailRessources.length > 0">
      <div class="dr-footer-count">
        <jhi-item-count [params]="{ page: page, totalItems: totalItems, itemsPerPage: itemsPerPage }"></jhi-item-count>
      </div>

      <div class="dr-footer-pagination">
        <ngb-pagination
          [collectionSize]="totalItems"
          [page]="page"
          [pageSize]="itemsPerPage"
          [maxSize]="5"
          [rotate]="true"
          [boundaryLinks]="true"
          (pageChange)="navigateToPage($event)"
        ></ngb-pagination>
      </div>
    </div>
  </div>
</div>
