<div class="vehicule-update-page">
  <div class="cu-container">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <jhi-alert-error></jhi-alert-error>

      <!-- Toolbar : ID (gauche) + Enregistrer (droite) -->
      <div class="cu-toolbar">
        <div class="cu-toolbar-left">
          <span *ngIf="editForm.get('id')?.value" class="cu-badge-id"> ID&nbsp;{{ editForm.get('id')?.value }} </span>
        </div>

        <button
          type="submit"
          id="save-entity-top"
          data-cy="entityCreateSaveButton"
          title="Enregistrer"
          [disabled]="editForm.invalid || isSaving"
          class="btn-cu-save"
        >
          <fa-icon icon="save"></fa-icon>
        </button>
      </div>

      <!-- Accordéon -->
      <div class="cu-accordion">
        <!-- Informations Générales -->
        <div class="cu-accordion-item" [class.open]="isSectionOpen('general')">
          <button type="button" class="cu-accordion-header" (click)="toggleSection('general')">
            <span class="cu-accordion-header-left">
              <fa-icon icon="truck" class="cu-accordion-icon"></fa-icon>
              <span jhiTranslate="gpmGatewayApp.projectServiceVehicule.home.createOrEditLabel">Informations Générales</span>
            </span>
            <fa-icon icon="chevron-down" class="cu-accordion-chevron"></fa-icon>
          </button>

          <div class="cu-accordion-body" *ngIf="isSectionOpen('general')">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold" for="field_marque">
                  <span jhiTranslate="gpmGatewayApp.projectServiceVehicule.marque">Marque</span>
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" name="marque" id="field_marque" data-cy="marque" formControlName="marque" />
                <div *ngIf="editForm.get('marque')!.invalid && (editForm.get('marque')!.dirty || editForm.get('marque')!.touched)">
                  <small
                    class="form-text text-danger"
                    *ngIf="editForm.get('marque')?.errors?.required"
                    jhiTranslate="entity.validation.required"
                  >
                    Ce champ est obligatoire.
                  </small>
                </div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold" for="field_type">
                  <span jhiTranslate="gpmGatewayApp.projectServiceVehicule.type">Type</span>
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" name="type" id="field_type" data-cy="type" formControlName="type" />
                <div *ngIf="editForm.get('type')!.invalid && (editForm.get('type')!.dirty || editForm.get('type')!.touched)">
                  <small
                    class="form-text text-danger"
                    *ngIf="editForm.get('type')?.errors?.required"
                    jhiTranslate="entity.validation.required"
                  >
                    Ce champ est obligatoire.
                  </small>
                </div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold" for="field_matricule">
                  <span jhiTranslate="gpmGatewayApp.projectServiceVehicule.matricule">Matricule</span>
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  name="matricule"
                  id="field_matricule"
                  data-cy="matricule"
                  formControlName="matricule"
                />
                <div *ngIf="editForm.get('matricule')!.invalid && (editForm.get('matricule')!.dirty || editForm.get('matricule')!.touched)">
                  <small
                    class="form-text text-danger"
                    *ngIf="editForm.get('matricule')?.errors?.required"
                    jhiTranslate="entity.validation.required"
                  >
                    Ce champ est obligatoire.
                  </small>
                </div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold" for="field_nbPlaces">
                  <span jhiTranslate="gpmGatewayApp.projectServiceVehicule.nbPlaces">Nb Places</span>
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="number"
                  class="form-control"
                  name="nbPlaces"
                  id="field_nbPlaces"
                  data-cy="nbPlaces"
                  formControlName="nbPlaces"
                />
                <div *ngIf="editForm.get('nbPlaces')!.invalid && (editForm.get('nbPlaces')!.dirty || editForm.get('nbPlaces')!.touched)">
                  <small
                    class="form-text text-danger"
                    *ngIf="editForm.get('nbPlaces')?.errors?.required"
                    jhiTranslate="entity.validation.required"
                  >
                    Ce champ est obligatoire.
                  </small>
                  <small
                    class="form-text text-danger"
                    [hidden]="!editForm.get('nbPlaces')?.errors?.number"
                    jhiTranslate="entity.validation.number"
                  >
                    Ce champ doit être un nombre.
                  </small>
                </div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold" jhiTranslate="gpmGatewayApp.projectServiceVehicule.statut" for="field_statut"
                  >Statut</label
                >
                <select class="form-control" name="statut" formControlName="statut" id="field_statut" data-cy="statut">
                  <option [ngValue]="null">{{ 'gpmGatewayApp.StatutVehicule.null' | translate }}</option>
                  <option *ngFor="let statutVehicule of statutVehiculeValues" [value]="statutVehicule">
                    {{ 'gpmGatewayApp.StatutVehicule.' + statutVehicule | translate }}
                  </option>
                </select>
                <div *ngIf="editForm.get('statut')!.invalid && (editForm.get('statut')!.dirty || editForm.get('statut')!.touched)">
                  <small
                    class="form-text text-danger"
                    *ngIf="editForm.get('statut')?.errors?.required"
                    jhiTranslate="entity.validation.required"
                  >
                    Ce champ est obligatoire.
                  </small>
                </div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold" jhiTranslate="gpmGatewayApp.projectServiceVehicule.agence" for="field_agence"
                  >Agence</label
                >
                <select
                  class="form-control"
                  id="field_agence"
                  data-cy="agence"
                  name="agence"
                  formControlName="agence"
                  [compareWith]="compareAgence"
                >
                  <option *ngIf="editForm.get(['agence'])!.value == null" [ngValue]="null" selected></option>
                  <option [ngValue]="agenceOption" *ngFor="let agenceOption of agencesSharedCollection">
                    {{ agenceOption.designation }}
                  </option>
                </select>
                <div *ngIf="editForm.get(['agence'])!.invalid && (editForm.get(['agence'])!.dirty || editForm.get(['agence'])!.touched)">
                  <small
                    class="form-text text-danger"
                    *ngIf="editForm.get(['agence'])?.errors?.required"
                    jhiTranslate="entity.validation.required"
                  >
                    Ce champ est obligatoire.
                  </small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Informations Techniques -->
        <div class="cu-accordion-item" [class.open]="isSectionOpen('technique')">
          <button type="button" class="cu-accordion-header" (click)="toggleSection('technique')">
            <span class="cu-accordion-header-left">
              <fa-icon icon="gas-pump" class="cu-accordion-icon"></fa-icon>
              <span>Informations Techniques</span>
            </span>
            <fa-icon icon="chevron-down" class="cu-accordion-chevron"></fa-icon>
          </button>

          <div class="cu-accordion-body" *ngIf="isSectionOpen('technique')">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label
                  class="form-label fw-bold"
                  jhiTranslate="gpmGatewayApp.projectServiceVehicule.numCarteGrise"
                  for="field_numCarteGrise"
                  >Num Carte Grise</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="numCarteGrise"
                  id="field_numCarteGrise"
                  data-cy="numCarteGrise"
                  formControlName="numCarteGrise"
                />
              </div>

              <div class="col-md-4 mb-3">
                <label
                  class="form-label fw-bold"
                  jhiTranslate="gpmGatewayApp.projectServiceVehicule.dateCirculation"
                  for="field_dateCirculation"
                  >Date Circulation</label
                >
                <div class="input-group">
                  <input
                    id="field_dateCirculation"
                    data-cy="dateCirculation"
                    type="text"
                    class="form-control"
                    name="dateCirculation"
                    ngbDatepicker
                    #dateCirculationDp="ngbDatepicker"
                    formControlName="dateCirculation"
                  />
                  <button type="button" class="btn btn-outline-secondary" (click)="dateCirculationDp.toggle()">
                    <fa-icon icon="calendar-alt"></fa-icon>
                  </button>
                </div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold" for="field_typeCarburant">
                  <span jhiTranslate="gpmGatewayApp.projectServiceVehicule.typeCarburant">Type Carburant</span>
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  name="typeCarburant"
                  id="field_typeCarburant"
                  data-cy="typeCarburant"
                  formControlName="typeCarburant"
                />
                <div
                  *ngIf="
                    editForm.get('typeCarburant')!.invalid &&
                    (editForm.get('typeCarburant')!.dirty || editForm.get('typeCarburant')!.touched)
                  "
                >
                  <small
                    class="form-text text-danger"
                    *ngIf="editForm.get('typeCarburant')?.errors?.required"
                    jhiTranslate="entity.validation.required"
                  >
                    Ce champ est obligatoire.
                  </small>
                </div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold" jhiTranslate="gpmGatewayApp.projectServiceVehicule.chargeFixe" for="field_chargeFixe"
                  >Charge Fixe</label
                >
                <input
                  type="number"
                  class="form-control"
                  name="chargeFixe"
                  id="field_chargeFixe"
                  data-cy="chargeFixe"
                  formControlName="chargeFixe"
                />
              </div>

              <div class="col-md-4 mb-3">
                <label
                  class="form-label fw-bold"
                  jhiTranslate="gpmGatewayApp.projectServiceVehicule.tauxConsommation"
                  for="field_tauxConsommation"
                  >Taux Consommation</label
                >
                <input
                  type="number"
                  class="form-control"
                  name="tauxConsommation"
                  id="field_tauxConsommation"
                  data-cy="tauxConsommation"
                  formControlName="tauxConsommation"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="cu-toolbar cu-toolbar-bottom">
        <div class="cu-toolbar-left"></div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn-cu-cancel" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>
      </div>
    </form>
  </div>
</div>
