<div class="home-container" *ngIf="!account">
  <div class="hero-card">
    <div class="logo-placeholder">
      <!-- App Logo or Icon -->
      <img src="content/images/logoGpm.png" alt="Logo" class="app-logo" />
    </div>
    <h1 class="welcome-title">Bienvenue</h1>

    <!-- Dev mode: manual login button -->
    <div *ngIf="isDev">
      <button type="button" class="btn btn-primary" (click)="login()">Connecter</button>
    </div>

    <!-- Non-dev mode: loading indicator -->
    <div *ngIf="!isDev" class="loading-container">
      <div class="spinner" role="status" aria-label="Chargement"></div>
      <p class="loading-text">Chargement en cours...</p>
    </div>
  </div>
</div>

<div *ngIf="account" class="logged-in-container"></div>
